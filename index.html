<!DOCTYPE html>
<html>
<head>
<title>Decimal Operations Quiz</title>

<style>
body {
  font-family: Arial;
  background: #d6f0ff;
  text-align: center;
}

.quiz-box {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 60%;
  margin: auto;
  margin-top: 50px;
}

button {
  background: #fff5b1;
  border: none;
  padding: 10px;
  margin: 8px;
  width: 80%;
  border-radius: 10px;
  cursor: pointer;
  font-size: 18px;
}

.correct { background: lightgreen; }
.wrong { background: #ff9e9e; }

#result {
  display: none;
  font-size: 24px;
}
</style>

</head>

<body>

<div class="quiz-box">
<h2>🔢 Decimal Operations Quiz</h2>
<p id="question"></p>
<div id="options"></div>
</div>

<div id="result"></div>

<audio id="correctSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="wrongSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script>

  let questions = [

/* 1 */ {q:"223.7 × 10 = ?",a:2237},
/* 2 */ {q:"223.7 ÷ 10 = ?",a:22.37},

/* 3 */ {q:"223.7 × 100 = ?",a:22370},
/* 4 */ {q:"223.7 ÷ 100 = ?",a:2.237},

/* 5 */ {q:"223.7 × 1000 = ?",a:223700},
/* 6 */ {q:"223.7 ÷ 1000 = ?",a:0.2237},

/* 7 */ {q:"45.6 × 10 = ?",a:456},
/* 8 */ {q:"45.6 ÷ 10 = ?",a:4.56},

/* 9 */ {q:"45.6 × 100 = ?",a:4560},
/* 10 */ {q:"45.6 ÷ 100 = ?",a:0.456},

/* 11 */ {q:"45.6 × 1000 = ?",a:45600},
/* 12 */ {q:"45.6 ÷ 1000 = ?",a:0.0456},

/* 13 */ {q:"9.81 × 10 = ?",a:98.1},
/* 14 */ {q:"9.81 ÷ 10 = ?",a:0.981},

/* 15 */ {q:"9.81 × 100 = ?",a:981},
/* 16 */ {q:"9.81 ÷ 100 = ?",a:0.0981},

/* 17 */ {q:"9.81 × 1000 = ?",a:9810},
/* 18 */ {q:"9.81 ÷ 1000 = ?",a:0.00981},

/* 19 */ {q:"12.34 × 10 = ?",a:123.4},
/* 20 */ {q:"12.34 ÷ 10 = ?",a:1.234},

/* 21 */ {q:"12.34 × 100 = ?",a:1234},
/* 22 */ {q:"12.34 ÷ 100 = ?",a:0.1234},

/* 23 */ {q:"12.34 × 1000 = ?",a:12340},
/* 24 */ {q:"12.34 ÷ 1000 = ?",a:0.01234},

/* 25 */ {q:"7.5 × 10 = ?",a:75},
/* 26 */ {q:"7.5 ÷ 10 = ?",a:0.75},

/* 27 */ {q:"98.2 × 10 = ?",a:982},
/* 28 */ {q:"98.2 ÷ 100 = ?",a:0.982},

/* 29 */ {q:"56.78 × 100 = ?",a:5678},
/* 30 */ {q:"56.78 ÷ 1000 = ?",a:0.05678},

/* 31 */ {q:"3.45 × 1000 = ?",a:3450},
/* 32 */ {q:"3.45 ÷ 100 = ?",a:0.0345},

/* 33 */ {q:"87.9 × 10 = ?",a:879},
/* 34 */ {q:"87.9 ÷ 100 = ?",a:0.879},

/* 35 */ {q:"6.2 × 100 = ?",a:620}

];

let current = 0;
let score = 0;

function generateOptions(correct){
  let options = new Set();
  options.add(correct);

  while(options.size < 4){
    let rand = (Math.random() * correct * 2).toFixed(4);
    options.add(Number(rand));
  }

  return [...options].sort(()=>Math.random()-0.5);
}

function loadQuestion(){
  if(current >= questions.length){
    showResult();
    return;
  }

  let q = questions[current];
  document.getElementById("question").innerText = (current+1) + ". " + q.q;

  let opts = generateOptions(q.a);

  let html = "";
  opts.forEach(opt=>{
    html += `<button onclick="checkAnswer(this,${q.a})">${opt}</button>`;
  });

  document.getElementById("options").innerHTML = html;
}

function checkAnswer(btn, correct){
  let buttons = document.querySelectorAll("button");
  buttons.forEach(b=>b.disabled=true);

  if(Number(btn.innerText) === correct){
    btn.classList.add("correct");
    document.getElementById("correctSound").play();
    score++;
  } else {
    btn.classList.add("wrong");
    document.getElementById("wrongSound").play();
  }

  setTimeout(()=>{
    current++;
    loadQuestion();
  },1000);
}

function showResult(){
  document.querySelector(".quiz-box").style.display="none";
  let res = document.getElementById("result");
  res.style.display="block";

  let msg = score>=30 ? "🌟 Excellent!" :
            score>=20 ? "👏 Great Job!" :
            score>=10 ? "👍 Good!" :
            "💪 Keep Practicing!";

  res.innerHTML = `
  ${msg} <br><br>
  Your Score: <b>${score} / ${questions.length}</b>
  `;
}

loadQuestion();

</script>

</body>
</html>
